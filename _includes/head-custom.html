<!-- Mermaid.js v11 via CDN -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
  // Mermaid fix: kramdown renders ```mermaid as <pre><code class="language-mermaid">
  // but Mermaid.js needs <pre class="mermaid"> or <div class="mermaid">.
  // We convert the DOM before mermaid.initialize() runs.
  document.addEventListener("DOMContentLoaded", function () {
    // Transform <pre><code class="language-mermaid">…</code></pre>
    // → <div class="mermaid">…</div>
    document.querySelectorAll("pre > code.language-mermaid").forEach(function (code) {
      var pre = code.parentElement;
      var div = document.createElement("div");
      div.className = "mermaid";
      div.textContent = code.textContent;
      pre.parentNode.replaceChild(div, pre);
    });

    mermaid.initialize({
      startOnLoad: true,
      theme: "default",
      themeVariables: {
        primaryColor:       "#e8f0fe",
        primaryTextColor:   "#1a1a2e",
        primaryBorderColor: "#4285f4",
        lineColor:          "#5f6368",
        secondaryColor:     "#f1f8e9",
        tertiaryColor:      "#fce8e6",
        fontSize:           "14px"
      },
      flowchart:  { curve: "basis",   padding: 20, useMaxWidth: true },
      sequence:   { actorMargin: 60,  useMaxWidth: true },
      er:         { useMaxWidth: true }
    });
  });
</script>
