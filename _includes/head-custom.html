<!-- Mermaid.js v11 -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
(function() {
  function initMermaid() {
    // With kramdown + rouge, a ```mermaid fence renders as:
    //   <div class="language-mermaid highlighter-rouge">
    //     <div class="highlight">
    //       <pre class="highlight"><code>…diagram source…</code></pre>
    //     </div>
    //   </div>
    //
    // Without rouge (plain kramdown), it renders as:
    //   <pre><code class="language-mermaid">…</code></pre>
    //
    // We handle both, replacing the wrapper with <div class="mermaid">
    // so Mermaid.js startOnLoad can find and render them.

    var found = 0;

    // Case 1: rouge highlighter wrapping (GitHub Pages default)
    document.querySelectorAll('div.language-mermaid').forEach(function(wrapper) {
      var code = wrapper.querySelector('code');
      if (!code) return;
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code.textContent;
      wrapper.parentNode.replaceChild(div, wrapper);
      found++;
    });

    // Case 2: plain kramdown (no rouge)
    document.querySelectorAll('pre > code.language-mermaid').forEach(function(code) {
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code.textContent;
      code.parentNode.parentNode.replaceChild(div, code.parentNode);
      found++;
    });

    if (found > 0) {
      mermaid.init(undefined, document.querySelectorAll('div.mermaid'));
    }
  }

  // Configure Mermaid before init
  mermaid.initialize({
    startOnLoad: false,   // We call init() manually after DOM transform
    theme: 'default',
    themeVariables: {
      primaryColor:       '#dbeafe',
      primaryTextColor:   '#1e293b',
      primaryBorderColor: '#3b82f6',
      lineColor:          '#64748b',
      secondaryColor:     '#f0fdf4',
      tertiaryColor:      '#fef9c3',
      fontSize:           '14px'
    },
    flowchart:  { curve: 'basis', padding: 20, useMaxWidth: true },
    sequence:   { actorMargin: 50, useMaxWidth: true },
    er:         { useMaxWidth: true }
  });

  // Run after DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMermaid);
  } else {
    initMermaid();
  }
})();
</script>
