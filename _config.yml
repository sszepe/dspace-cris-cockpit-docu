title: DSpace CRIS Cockpit
description: Developer, Admin, Operations and User Documentation
theme: minima
url: "https://sszepe.github.io"
baseurl: "/dspace-cris-cockpit-docu"

markdown: kramdown
kramdown:
  input: GFM
  # Keep rouge for syntax highlighting of real code blocks,
  # but our head-custom.html JS handles the mermaid wrapper conversion.
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false

plugins:
  - jekyll-feed

# Minima: suppress auto-generated page list in header (we use header.html override)
minima:
  header_pages: []

nav:
  - title: "🚀 Quick Launch"
    url: /quick-launch/
  - title: Developer Guide
    url: /dev/
    children:
      - title: Architecture
        url: /dev/architecture/
      - title: Quick Start
        url: /dev/quickstart/
      - title: Frontend
        url: /dev/frontend/
      - title: Backend (Django)
        url: /dev/backend/
      - title: DSpace Integration
        url: /dev/dspace/
      - title: Deployment
        url: /dev/deployment/
  - title: Admin Guide
    url: /admin/
    children:
      - title: Roles & Permissions
        url: /admin/roles/
      - title: Feature Flags
        url: /admin/flags/
      - title: Dashboard Clusters
        url: /admin/clusters/
      - title: Quicklinks
        url: /admin/quicklinks/
      - title: Form Builder
        url: /admin/formbuilder/
      - title: Communities
        url: /admin/communities/
  - title: User Guide
    url: /user/
    children:
      - title: Getting Started
        url: /user/getting-started/
      - title: Dashboard
        url: /user/dashboard/
      - title: Workspace
        url: /user/workspace/
      - title: Search
        url: /user/search/
      - title: Quicklinks
        url: /user/quicklinks/
      - title: Communities
        url: /user/communities/
      - title: Profile
        url: /user/profile/
      - title: FAQ & Glossary
        url: /user/faq/
  - title: Operations
    url: /ops/
    children:
      - title: Base Stack
        url: /ops/stack/
      - title: Monitoring
        url: /ops/monitoring/
      - title: Alerting
        url: /ops/alerting/
